<script>
  alert("Dite 0 para sair");

  do {
    const num = Number(prompt("Número: "));

    if (num == 0 || isNaN(num)) {
      const sair = confirm("Comfirmar sáida?");
      if (sair) {
        break;
      } else {           
        continue;
      }
    }
    if (num % 2 === 0) {
      alert(`O dobro do ${num} é ${num * 2}`);
    } else {
      alert(`O triplo don ${num} é ${num * 3}`);
    }
  } while (true);

  alert("Bye, bye...");
</script>
